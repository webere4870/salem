<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sermon Dropdown</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #f1f1f1;
    }
    .dropdown-item:last-child {
      border-bottom: none;
    }
    .sermon-title {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .sermon-passage {
      font-size: 0.9rem;
      color: #6c757d;
    }
    .icon-buttons {
      display: flex;
      gap: 8px;
    }
    .icon-buttons i {
      cursor: pointer;
      color: #007bff;
      transition: color 0.2s;
    }
    .icon-buttons i:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2>Sermon List</h2>
  <div class="dropdown">
    <button class="btn btn-primary dropdown-toggle" type="button" id="sermonDropdown" data-bs-toggle="dropdown" aria-expanded="false">
      Select a Sermon
    </button>
    <ul class="dropdown-menu" style="max-height: 300px; overflow-y: auto; width: 400px;" aria-labelledby="sermonDropdown">
      <li>
        <div class="dropdown-item">
          <div>
            <div class="sermon-title">Creation: Believe It or Not, Part 1</div>
            <div class="sermon-passage">Genesis 1:1-10</div>
          </div>
          <div class="icon-buttons">
            <i class="bi bi-play-circle" title="Play"></i>
            <i class="bi bi-download" title="Download"></i>
            <i class="bi bi-bookmark" title="Bookmark"></i>
          </div>
        </div>
      </li>
      <li>
        <div class="dropdown-item">
          <div>
            <div class="sermon-title">Faith in Action</div>
            <div class="sermon-passage">Hebrews 11:1-10</div>
          </div>
          <div class="icon-buttons">
            <i class="bi bi-play-circle" title="Play"></i>
            <i class="bi bi-download" title="Download"></i>
            <i class="bi bi-bookmark" title="Bookmark"></i>
          </div>
        </div>
      </li>
      <!-- Add more sermon items here -->
    </ul>
  </div>
</div>

<!-- Bootstrap JS and Icons -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
